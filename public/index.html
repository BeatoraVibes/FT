<!DOCTYPE html>
<html>
<head>
<title>TV Media</title>

<style>
body {
    background:#000;
    color:white;
    font-family:Arial;
    margin:0;
    padding:20px;
}

h1 {
    font-size:28px;
    margin-bottom:20px;
}

.grid {
    display:grid;
    grid-template-columns: repeat(3, 1fr); /* ONLY 3 per row */
    gap:30px;
}

.card {
    background:#111;
    border-radius:16px;
    padding:10px;
    cursor:pointer;
    outline:none;
    transition:0.2s;
}

.card:focus {
    transform:scale(1.1);
    border:3px solid #00ff99;
}

.preview {
    width:100%;
    height:180px;
    border-radius:12px;
    object-fit:cover;
    background:#222;
}

.name {
    margin-top:10px;
    font-size:18px;
    word-break:break-word;
}

button {
    margin-top:8px;
    padding:8px;
    font-size:14px;
    background:red;
    color:white;
    border:none;
    border-radius:6px;
}

form {
    margin-top:5px;
}

.upload {
    margin-bottom:25px;
}
</style>
</head>

<body>

<h1>📺 Media Hub</h1>

<div class="upload">
<form action="/upload" method="post" enctype="multipart/form-data">
    <input type="file" name="file" required>
    <button>Upload</button>
</form>
</div>

<div class="grid" id="grid"></div>

<script>
let cards = [];
let index = 0;
let cols = 3;

async function loadFiles() {
    const res = await fetch('/files');
    const files = await res.json();

    const grid = document.getElementById('grid');
    grid.innerHTML = '';

    files.forEach((file) => {
        const ext = file.split('.').pop().toLowerCase();
        const card = document.createElement('div');
        card.className = 'card';
        card.tabIndex = 0;

        let preview = '';

        if (['mp4','webm','mkv'].includes(ext)) {
            preview = `<video class="preview" src="/stream/${file}"></video>`;
            card.onclick = () => playVideo(file);
        } else if (['jpg','png','jpeg'].includes(ext)) {
            preview = `<img class="preview" src="/stream/${file}">`;
        } else {
            preview = `<div class="preview" style="display:flex;align-items:center;justify-content:center;font-size:40px;">📄</div>`;
            card.onclick = () => window.location = '/download/' + file;
        }

        card.innerHTML = `
            ${preview}
            <div class="name">${file}</div>
            <form method="post" action="/delete">
                <input type="hidden" name="name" value="${file}">
                <button onclick="return confirm('Delete?')">Delete</button>
            </form>
        `;

        grid.appendChild(card);
    });

    cards = document.querySelectorAll('.card');
    index = 0;
    cards[index]?.focus();
}

// Video player fullscreen
function playVideo(file) {
    document.body.innerHTML = `
        <video controls autoplay style="width:100%;height:100vh;background:black">
            <source src="/stream/${file}">
        </video>
    `;
}

// Remote navigation
document.addEventListener('keydown', (e) => {
    if (!cards.length) return;

    if (e.key === 'ArrowRight') index++;
    if (e.key === 'ArrowLeft') index--;
    if (e.key === 'ArrowDown') index += cols;
    if (e.key === 'ArrowUp') index -= cols;

    if (index < 0) index = 0;
    if (index >= cards.length) index = cards.length - 1;

    cards[index].focus();
});

loadFiles();
</script>

</body>
</html>
