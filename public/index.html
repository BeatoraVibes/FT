<!DOCTYPE html>
<html>
<head>
  <title>Media Hub</title>

  <style>
    body {
      background: black;
      color: white;
      font-family: Arial;
      padding: 20px;
    }

    button {
      background: red;
      color: white;
      border: none;
      padding: 8px 12px;
      margin: 5px;
      cursor: pointer;
      border-radius: 5px;
    }

    input {
      padding: 8px;
      margin: 5px;
    }

    .row {
      display: flex;
      overflow-x: auto;
      gap: 12px;
      margin-top: 10px;
    }

    .card {
      min-width: 180px;
      max-width: 180px;
      background: #111;
      padding: 8px;
      border-radius: 10px;
      flex-shrink: 0;
    }

    video, img {
      width: 100%;
      height: 120px;
      object-fit: cover;
      border-radius: 6px;
    }

    .delete-btn {
      background: red;
      margin-top: 5px;
      width: 100%;
    }

    #uploadSection {
      display: none;
      margin-top: 20px;
    }
  </style>
</head>

<body>

<h1>📺 Media Hub</h1>

<!-- ROOM -->
<button onclick="createRoom()">Create Room</button>
<input id="codeInput" placeholder="Enter code">
<button onclick="joinRoom()">Join Room</button>

<p id="shareLink"></p>

<!-- UPLOAD -->
<div id="uploadSection">
  <input type="file" id="fileInput">
  <button onclick="uploadFile()">Upload</button>
</div>

<div id="content"></div>

<script>

let currentRoomId = null;

/* ========= AUTO JOIN FROM LINK ========= */
window.onload = async () => {
  const params = new URLSearchParams(window.location.search);
  const code = params.get("room");

  if (code) {
    document.getElementById("codeInput").value = code;
    await joinRoom();
  }
};

/* ========= CREATE ROOM ========= */
async function createRoom() {
  const res = await fetch("/create-room", { method: "POST" });
  const data = await res.json();

  alert("Room Code: " + data.code);

  currentRoomId = data.roomId;

  showShareLink(data.code);
  enableApp();
  loadFiles();
}

/* ========= JOIN ROOM ========= */
async function joinRoom() {
  const code = document.getElementById("codeInput").value;

  const res = await fetch("/join-room", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ code })
  });

  if (!res.ok) {
    alert("Invalid code");
    return;
  }

  const data = await res.json();

  currentRoomId = data.roomId;

  showShareLink(code);
  enableApp();
  loadFiles();
}

/* ========= SHARE LINK ========= */
function showShareLink(code) {
  const link = `${window.location.origin}?room=${code}`;

  document.getElementById("shareLink").innerHTML =
    `Share: <a href="${link}" target="_blank" style="color:cyan">${link}</a>`;
}

/* ========= ENABLE APP ========= */
function enableApp() {
  document.getElementById("uploadSection").style.display = "block";
}

/* ========= UPLOAD ========= */
async function uploadFile() {
  if (!currentRoomId) {
    alert("Join room first");
    return;
  }

  const file = document.getElementById("fileInput").files[0];
  if (!file) return;

  const formData = new FormData();
  formData.append("file", file);
  formData.append("roomId", currentRoomId);

  await fetch("/upload", {
    method: "POST",
    body: formData
  });

  loadFiles();
}

/* ========= LOAD FILES ========= */
async function loadFiles() {
  if (!currentRoomId) return;

  const res = await fetch(`/files?roomId=${currentRoomId}`);
  const files = await res.json();

  const videos = [];
  const images = [];
  const others = [];

  files.forEach(f => {
    if (f.url.includes("video")) videos.push(f);
    else if (f.url.match(/\.(jpg|png|jpeg|webp)/)) images.push(f);
    else others.push(f);
  });

  document.getElementById("content").innerHTML =
    createRow("🎬 Videos", videos, "video") +
    createRow("🖼 Images", images, "image") +
    createRow("📁 Others", others, "other");
}

/* ========= CREATE ROW ========= */
function createRow(title, items, type) {
  if (!items.length) return "";

  return `
    <h2>${title}</h2>
    <div class="row">
      ${items.map(f => `
        <div class="card">
          ${
            type === "video"
              ? `<video src="${f.url}" controls></video>`
              : type === "image"
              ? `<img src="${f.url}">`
              : `<a href="${f.url}" target="_blank">Open</a>`
          }
          <button onclick="deleteFile('${f.publicId}', '${getType(f.url)}')">Delete</button>
        </div>
      `).join("")}
    </div>
  `;
}

/* ========= DELETE ========= */
async function deleteFile(publicId, type) {
  if (!confirm("Delete this file?")) return;

  const res = await fetch("/delete", {
    method: "POST",
    headers: {
      "Content-Type": "application/json"
    },
    body: JSON.stringify({
      publicId,
      resourceType: type
    })
  });

  if (!res.ok) {
    alert("Delete failed");
    return;
  }

  loadFiles();
}

</script>

</body>
</html>
