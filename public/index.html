<!DOCTYPE html>
<html>
<head>
  <title>Media Hub</title>
  <style>
    body {
      background: black;
      color: white;
      font-family: Arial;
      padding: 20px;
    }

    h1 {
      margin-bottom: 20px;
    }

    button {
      background: red;
      color: white;
      border: none;
      padding: 8px 12px;
      margin: 5px;
      cursor: pointer;
      border-radius: 5px;
    }

    input {
      padding: 8px;
      margin: 5px;
    }

    .row {
      display: flex;
      overflow-x: auto;
      gap: 10px;
      margin-top: 10px;
    }

    .card {
      min-width: 200px;
      background: #111;
      padding: 10px;
      border-radius: 10px;
    }

    video, img {
      width: 100%;
      border-radius: 8px;
    }

    .delete-btn {
      background: red;
      margin-top: 5px;
      width: 100%;
    }
  </style>
</head>

<body>

<h1>📺 Media Hub</h1>

<!-- ROOM CONTROLS -->
<button onclick="createRoom()">Create Room</button>
<input id="codeInput" placeholder="Enter code">
<button onclick="joinRoom()">Join Room</button>

<br><br>

<!-- UPLOAD -->
<input type="file" id="fileInput">
<button id="uploadBtn" onclick="uploadFile()" disabled>Upload</button>

<p id="status"></p>

<!-- CONTENT -->
<div id="content" style="display:none;"></div>

<script>

let currentRoomId = null;

/* ========= CREATE ROOM ========= */
async function createRoom() {
  const res = await fetch("/create-room", { method: "POST" });
  const data = await res.json();

  alert("Room Code: " + data.code);

  currentRoomId = data.roomId;

  enableApp();
  loadFiles();
}

/* ========= JOIN ROOM ========= */
async function joinRoom() {
  const code = document.getElementById("codeInput").value;

  const res = await fetch("/join-room", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ code })
  });

  if (!res.ok) {
    alert("Invalid code");
    return;
  }

  const data = await res.json();

  currentRoomId = data.roomId;

  enableApp();
  loadFiles();
}

/* ========= ENABLE APP ========= */
function enableApp() {
  document.getElementById("uploadBtn").disabled = false;
  document.getElementById("content").style.display = "block";
}

/* ========= UPLOAD ========= */
async function uploadFile() {
  if (!currentRoomId) {
    alert("Join or create a room first");
    return;
  }

  const file = document.getElementById("fileInput").files[0];
  if (!file) return;

  const formData = new FormData();
  formData.append("file", file);
  formData.append("roomId", currentRoomId);

  document.getElementById("status").innerText = "Uploading...";

  await fetch("/upload", {
    method: "POST",
    body: formData
  });

  document.getElementById("status").innerText = "Uploaded ✔";

  loadFiles();
}

/* ========= LOAD FILES ========= */
async function loadFiles() {
  if (!currentRoomId) return;

  const res = await fetch(`/files?roomId=${currentRoomId}`);
  const files = await res.json();

  const videos = [];
  const images = [];
  const others = [];

  files.forEach(f => {
    if (f.url.includes("video")) videos.push(f);
    else if (f.url.match(/\.(jpg|png|jpeg|webp)/)) images.push(f);
    else others.push(f);
  });

  document.getElementById("content").innerHTML =
    createRow("🎬 Videos", videos, "video") +
    createRow("🖼 Images", images, "image") +
    createRow("📁 Others", others, "other");
}

/* ========= CREATE ROW ========= */
function createRow(title, items, type) {
  if (!items.length) return "";

  return `
    <h2>${title}</h2>
    <div class="row">
      ${items.map(f => `
        <div class="card">
          ${
            type === "video"
              ? `<video src="${f.url}" controls></video>`
              : type === "image"
              ? `<img src="${f.url}">`
              : `<a href="${f.url}" target="_blank">Open File</a>`
          }
          <button class="delete-btn" onclick="deleteFile('${f.publicId}')">Delete</button>
        </div>
      `).join("")}
    </div>
  `;
}

/* ========= DELETE ========= */
async function deleteFile(publicId) {
  if (!confirm("Delete this file?")) return;

  await fetch("/delete", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ publicId })
  });

  loadFiles();
}

</script>

</body>
</html>
