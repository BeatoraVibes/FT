<!DOCTYPE html>
<html>
<head>
  <title>Media Hub</title>

  <style>
    body {
      background: black;
      color: white;
      font-family: Arial;
    }

    h1 {
      margin-left: 20px;
    }

    .upload-box {
      margin: 20px;
    }

    button {
      background: red;
      color: white;
      border: none;
      padding: 8px 12px;
      cursor: pointer;
      border-radius: 5px;
    }

    .row {
      position: relative;
      margin: 20px;
    }

    .row h2 {
      margin-bottom: 10px;
    }

    .row-content {
      display: flex;
      overflow-x: auto;
      gap: 10px;
    }

    .card {
      min-width: 200px;
      background: #111;
      padding: 10px;
      border-radius: 10px;
    }

    video, img {
      width: 100%;
      border-radius: 8px;
    }

    .arrow {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      background: rgba(0,0,0,0.7);
      font-size: 20px;
    }

    .left { left: 0; }
    .right { right: 0; }

    /* FULLSCREEN VIEW */
    #viewer {
      display: none;
      position: fixed;
      top:0;
      left:0;
      width:100%;
      height:100%;
      background:black;
      justify-content:center;
      align-items:center;
      flex-direction:column;
    }

    #viewer video, #viewer img {
      max-width:90%;
      max-height:80%;
    }

    #closeBtn {
      position:absolute;
      top:10px;
      right:10px;
      font-size:25px;
      background:red;
      padding:5px 10px;
    }
  </style>
</head>

<body>

<h1>📺 Media Hub</h1>

<div class="upload-box">
  <input type="file" id="fileInput">
  <button onclick="upload()">Upload</button>
</div>

<!-- PROGRESS -->
<div id="progressBox" style="display:none; margin:20px;">
  <div style="background:#333; height:20px; width:300px;">
    <div id="progressBar" style="background:red; height:20px; width:0;"></div>
  </div>
  <div id="progressText"></div>
</div>

<div id="content"></div>

<!-- FULLSCREEN VIEW -->
<div id="viewer">
  <button id="closeBtn" onclick="closeViewer()">❌</button>
  <video id="viewVideo" controls></video>
  <img id="viewImage">
</div>

<script>

/* ================= UPLOAD ================= */
function upload(){
  const file = document.getElementById("fileInput").files[0];
  if(!file) return alert("Select file");

  const fd = new FormData();
  fd.append("file", file);

  const xhr = new XMLHttpRequest();

  const box = document.getElementById("progressBox");
  const bar = document.getElementById("progressBar");
  const text = document.getElementById("progressText");

  box.style.display = "block";

  xhr.upload.onprogress = function(e){
    if(e.lengthComputable){
      const percent = Math.round((e.loaded/e.total)*100);
      bar.style.width = percent+"%";
      text.innerText = percent+"% uploaded";
    }
  };

  xhr.onload = function(){
    if(xhr.status === 200){
      const data = JSON.parse(xhr.responseText);

      fetch("/save", {
        method:"POST",
        headers:{ "Content-Type":"application/json" },
        body: JSON.stringify(data)
      }).then(() => {
        text.innerText = "Upload Complete ✅";
        loadFiles();
      });

    } else {
      text.innerText = "Upload Failed ❌";
    }
  };

  xhr.open("POST","/upload");
  xhr.send(fd);
}

/* ================= LOAD FILES ================= */
async function loadFiles(){
  const res = await fetch("/files");
  const files = await res.json();

  const c = categorize(files);

  content.innerHTML =
    createRow("🎬 Videos", c.videos, "video", "vrow") +
    createRow("🖼 Images", c.images, "image", "irow") +
    createRow("📦 Others", c.others, "other", "orow");
}

/* ================= CATEGORIZE ================= */
function categorize(files){
  const c = {videos:[], images:[], others:[]};

  files.forEach(f => {
    if(f.url.includes(".mp4")) c.videos.push(f);
    else if(f.url.match(/\.(jpg|png|jpeg)/)) c.images.push(f);
    else c.others.push(f);
  });

  return c;
}

/* ================= CREATE ROW ================= */
function createRow(title, items, type, id){
  if(!items.length) return "";

  return `
  <div class="row">
    <h2>${title}</h2>

    <button class="arrow left" onclick="scrollRow('${id}',-1)">◀</button>

    <div class="row-content" id="${id}">
      ${items.map(file => `
        <div class="card">
          ${
            type==="video"
            ? `<video src="${file.url}" onclick="openVideo('${file.url}')"></video>`
            : `<img src="${file.url}" onclick="openImage('${file.url}')">`
          }
          <button onclick="deleteFile('${file.url}')">Delete</button>
        </div>
      `).join("")}
    </div>

    <button class="arrow right" onclick="scrollRow('${id}',1)">▶</button>
  </div>
  `;
}

/* ================= SCROLL ================= */
function scrollRow(id, dir){
  document.getElementById(id).scrollLeft += dir*300;
}

/* ================= DELETE ================= */
function deleteFile(url){
  if(!confirm("Are you sure you want to delete this file?")){
    return;
  }

  fetch("/delete", {
    method:"POST",
    headers:{ "Content-Type":"application/json" },
    body: JSON.stringify({ url })
  })
  .then(() => loadFiles());
}

/* ================= VIEW ================= */
function openVideo(url){
  viewer.style.display = "flex";
  viewVideo.src = url;
  viewVideo.style.display = "block";
  viewImage.style.display = "none";
}

function openImage(url){
  viewer.style.display = "flex";
  viewImage.src = url;
  viewImage.style.display = "block";
  viewVideo.style.display = "none";
}

function closeViewer(){
  viewer.style.display = "none";
  viewVideo.pause();
}

/* ================= INIT ================= */
loadFiles();

</script>

</body>
</html>
