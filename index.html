<!DOCTYPE html>
<html>
<head>
  <title>Media Hub</title>

  <style>
    body {
      background: black;
      color: white;
      font-family: Arial;
      padding: 20px;
    }

    h1 {
      font-size: 40px;
    }

    button {
      background: red;
      color: white;
      border: none;
      padding: 10px 15px;
      cursor: pointer;
      border-radius: 5px;
      font-size: 16px;
    }

    input {
      padding: 10px;
    }

    .card {
      border: 2px solid #00ffcc;
      padding: 10px;
      margin-top: 20px;
      width: 300px;
      border-radius: 10px;
    }

    video {
      width: 100%;
      border-radius: 10px;
    }

    /* VIDEO FULL SCREEN PLAYER */
    #videoContainer {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: black;
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 999;
    }

    #player {
      width: 80%;
      max-height: 90%;
    }

    #closeBtn {
      position: absolute;
      top: 20px;
      right: 20px;
      background: red;
      font-size: 20px;
      display: none;
    }
  </style>
</head>

<body>

  <h1>📺 Media Hub</h1>

  <input type="file" id="fileInput">
  <button onclick="upload()">Upload</button>

  <div id="files"></div>

  <!-- VIDEO PLAYER -->
  <div id="videoContainer">
    <video id="player" controls></video>
    <button id="closeBtn">❌</button>
  </div>

  <script>
    const video = document.getElementById("player");
    const closeBtn = document.getElementById("closeBtn");
    const container = document.getElementById("videoContainer");

    // LOAD FILES
    async function loadFiles() {
      const res = await fetch("/files");
      const files = await res.json();

      const div = document.getElementById("files");
      div.innerHTML = "";

      files.forEach(file => {
        div.innerHTML += `
          <div class="card">
            <video src="/uploads/${file}"></video>
            <p>${file}</p>

            <button onclick="playVideo('${file}')">Play</button>
            <button onclick="deleteFile('${file}')">Delete</button>
          </div>
        `;
      });
    }

    // UPLOAD
    async function upload() {
      const file = document.getElementById("fileInput").files[0];
      if (!file) {
        alert("Select file first");
        return;
      }

      const formData = new FormData();
      formData.append("file", file);

      await fetch("/upload", {
        method: "POST",
        body: formData
      });

      loadFiles();
    }

    // PLAY VIDEO
    function playVideo(file) {
      video.src = "/uploads/" + file;
      container.style.display = "flex";
      closeBtn.style.display = "none";
      video.play();
    }

    // WHEN VIDEO ENDS → SHOW ❌
    video.addEventListener("ended", () => {
      
    // CLOSE BUTTON
    closeBtn.onclick = () => {
      video.pause();
      video.currentTime = 0;
      container.style.display = "none";
      closeBtn.style.display = "block";
    };

    // DELETE FILE
    async function deleteFile(file) {
      await fetch("/delete/" + file, {
        method: "DELETE"
      });
      loadFiles();
    }

    // INITIAL LOAD
    loadFiles();
  </script>

</body>
</html>
