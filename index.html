<!DOCTYPE html>
<html>
<head>
<title>Media Hub</title>

<style>
body {
  background:#000;
  color:white;
  font-family:Arial;
  padding:15px;
}

/* ROW */
.row-wrapper {
  position:relative;
}

.row {
  display:flex;
  overflow-x:auto;
  gap:15px;
  scroll-behavior:smooth;
}

/* CARDS */
.card {
  min-width:200px;
  max-width:200px;
  background:#111;
  border-radius:10px;
  padding:10px;
}

video, img {
  width:100%;
  height:120px;
  object-fit:cover;
  border-radius:8px;
}

/* ARROWS */
.arrow {
  position:absolute;
  top:40%;
  background:rgba(255,0,0,0.7);
  border:none;
  color:white;
  font-size:20px;
  padding:10px;
  cursor:pointer;
  z-index:10;
}

.left { left:0; }
.right { right:0; }

/* FULLSCREEN VIEW */
#viewer {
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  background:black;
  display:none;
  justify-content:center;
  align-items:center;
  z-index:1000;
}

#viewer video, #viewer img {
  max-width:90%;
  max-height:90%;
}

#closeBtn {
  position:absolute;
  top:20px;
  right:20px;
  background:red;
  padding:10px;
  font-size:18px;
}
</style>
</head>

<body>

<h1>📺 Media Hub</h1>

<input type="file" id="fileInput">
<button onclick="upload()">Upload</button>

<div id="content"></div>

<!-- FULLSCREEN -->
<div id="viewer">
  <video id="player" controls></video>
  <img id="imageView">
  <button id="closeBtn">❌</button>
</div>

<script>
const content = document.getElementById("content");
const viewer = document.getElementById("viewer");
const video = document.getElementById("player");
const img = document.getElementById("imageView");

function scrollRow(id, dir){
  const row = document.getElementById(id);
  row.scrollBy({ left: dir * 200, behavior:"smooth" });
}

function createRow(title, files, type, id){
  if(files.length===0) return "";

  return `
    <h2>${title}</h2>
    <div class="row-wrapper">
      <button class="arrow left" onclick="scrollRow('${id}', -1)">◀</button>
      <div class="row" id="${id}">
        ${files.map(f=>{
          let preview="";

          if(type==="video"){
            preview = `<video src="/uploads/${f}" onclick="openVideo('${f}')"></video>`;
          } else if(type==="image"){
            preview = `<img src="/uploads/${f}" onclick="openImage('${f}')">`;
          } else {
            preview = `<div style="height:120px;display:flex;align-items:center;justify-content:center;">📄</div>`;
          }

          return `
            <div class="card">
              ${preview}
              <p>${f}</p>
              <button onclick="deleteFile('${f}')">Delete</button>
            </div>
          `;
        }).join("")}
      </div>
      <button class="arrow right" onclick="scrollRow('${id}', 1)">▶</button>
    </div>
  `;
}

function categorize(files){
  return {
    videos: files.filter(f=>f.match(/\.(mp4|webm|mkv)$/i)),
    images: files.filter(f=>f.match(/\.(jpg|jpeg|png)$/i)),
    apks: files.filter(f=>f.endsWith(".apk")),
    others: files.filter(f=>!f.match(/\.(mp4|webm|mkv|jpg|jpeg|png|apk)$/i))
  };
}

async function loadFiles(){
  const res = await fetch("/files");
  const files = await res.json();

  const c = categorize(files);

  content.innerHTML =
    createRow("🎬 Videos", c.videos, "video", "vrow") +
    createRow("🖼 Images", c.images, "image", "irow") +
    createRow("📱 APK", c.apks, "apk", "arow") +
    createRow("📂 Others", c.others, "other", "orow");
}

/* OPEN VIDEO */
function openVideo(file){
  img.style.display="none";
  video.style.display="block";
  video.src="/uploads/"+file;
  viewer.style.display="flex";
  video.play();
}

/* OPEN IMAGE */
function openImage(file){
  video.pause();
  video.style.display="none";
  img.style.display="block";
  img.src="/uploads/"+file;
  viewer.style.display="flex";
}

/* CLOSE */
document.getElementById("closeBtn").onclick=()=>{
  viewer.style.display="none";
  video.pause();
};

/* UPLOAD */
async function upload(){
  const file=document.getElementById("fileInput").files[0];
  if(!file) return alert("Select file");

  const fd=new FormData();
  fd.append("file",file);

  await fetch("/upload",{method:"POST",body:fd});
  loadFiles();
}

/* DELETE */
async function deleteFile(name){
  await fetch("/delete",{
    method:"POST",
    headers:{ "Content-Type":"application/x-www-form-urlencoded" },
    body:"name="+encodeURIComponent(name)
  });
  loadFiles();
}

loadFiles();
</script>

</body>
</html>
