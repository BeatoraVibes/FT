<!DOCTYPE html>
<html>
<head>
  <title>Media Hub</title>
  <style>
    body {
      background: black;
      color: white;
      font-family: Arial;
      padding: 20px;
    }

    h1 {
      font-size: 30px;
    }

    button {
      background: red;
      color: white;
      border: none;
      padding: 10px 15px;
      cursor: pointer;
      border-radius: 5px;
      font-size: 16px;
    }

    .card {
      border: 2px solid #00ffae;
      border-radius: 10px;
      padding: 10px;
      margin-top: 20px;
      width: 320px;
    }

    video, img {
      width: 100%;
      border-radius: 8px;
    }

    #videoContainer {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: black;
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }

    #player {
      max-width: 90%;
      max-height: 90%;
    }

    /* ❌ ALWAYS VISIBLE */
    #closeBtn {
      position: absolute;
      top: 20px;
      right: 20px;
      background: red;
      padding: 10px 15px;
      font-size: 18px;
      display: block;
      border-radius: 6px;
    }
  </style>
</head>

<body>

<h1>📺 Media Hub</h1>

<input type="file" id="fileInput">
<button onclick="upload()">Upload</button>

<div id="files"></div>

<!-- VIDEO PLAYER -->
<div id="videoContainer">
  <video id="player" controls></video>
  <button id="closeBtn">❌</button>
</div>

<script>
const filesDiv = document.getElementById("files");
const video = document.getElementById("player");
const container = document.getElementById("videoContainer");
const closeBtn = document.getElementById("closeBtn");

// LOAD FILES
async function loadFiles() {
  const res = await fetch("/files");
  const data = await res.json();

  filesDiv.innerHTML = "";

  data.forEach(file => {
    const div = document.createElement("div");
    div.className = "card";

    let content = "";

    if (file.match(/\.(mp4|webm|ogg)$/)) {
      content = `<video src="/uploads/${file}" onclick="playVideo('${file}')"></video>`;
    } else if (file.match(/\.(jpg|jpeg|png|gif)$/)) {
      content = `<img src="/uploads/${file}">`;
    } else {
      content = `<p>${file}</p>`;
    }

    div.innerHTML = `
      ${content}
      <p>${file}</p>
      <button onclick="deleteFile('${file}')">Delete</button>
    `;

    filesDiv.appendChild(div);
  });
}

// PLAY VIDEO
function playVideo(file) {
  video.src = "/uploads/" + file;
  container.style.display = "flex";
  video.play();
}

// CLOSE VIDEO
closeBtn.onclick = () => {
  video.pause();
  video.currentTime = 0;
  container.style.display = "none";
};

// UPLOAD
async function upload() {
  const file = document.getElementById("fileInput").files[0];
  if (!file) return alert("Please select a file");

  const formData = new FormData();
  formData.append("file", file);

  await fetch("/upload", {
    method: "POST",
    body: formData
  });

  loadFiles();
}

// DELETE
async function deleteFile(name) {
  await fetch("/delete/" + name, { method: "DELETE" });
  loadFiles();
}

// INITIAL LOAD
loadFiles();
</script>

</body>
</html>
