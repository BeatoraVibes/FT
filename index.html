<!DOCTYPE html>
<html>
<head>
<title>Media Hub</title>

<style>
body {
  background:#000;
  color:white;
  font-family:Arial;
  padding:20px;
}

h2 {
  margin-top:30px;
}

.row {
  display:flex;
  overflow-x:auto;
  gap:15px;
}

.card {
  min-width:250px;
  background:#111;
  border-radius:10px;
  padding:10px;
}

video, img {
  width:100%;
  border-radius:8px;
}

button {
  margin-top:5px;
  padding:6px;
  background:red;
  border:none;
  color:white;
  cursor:pointer;
}

/* player */
#videoContainer {
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  background:black;
  display:none;
  justify-content:center;
  align-items:center;
}

#player {
  max-width:90%;
  max-height:90%;
}

#closeBtn {
  position:absolute;
  top:20px;
  right:20px;
  display:block;
}
</style>
</head>

<body>

<h1>📺 Media Hub</h1>

<input type="file" id="fileInput">
<button onclick="upload()">Upload</button>

<div id="content"></div>

<div id="videoContainer">
  <video id="player" controls></video>
  <button id="closeBtn">❌</button>
</div>

<script>
const content = document.getElementById("content");
const video = document.getElementById("player");
const container = document.getElementById("videoContainer");

function categorize(files) {
  return {
    videos: files.filter(f => f.match(/\.(mp4|webm|mkv)$/)),
    images: files.filter(f => f.match(/\.(jpg|jpeg|png)$/)),
    apks: files.filter(f => f.endsWith(".apk")),
    others: files.filter(f => 
      !f.match(/\.(mp4|webm|mkv|jpg|jpeg|png|apk)$/)
    )
  };
}

function createRow(title, files, type) {
  if (files.length === 0) return "";

  return `
    <h2>${title}</h2>
    <div class="row">
      ${files.map(file => {
        let preview = "";

        if (type === "video") {
          preview = `<video src="/uploads/${file}" onclick="play('${file}')"></video>`;
        } else if (type === "image") {
          preview = `<img src="/uploads/${file}">`;
        } else {
          preview = `<div style="height:150px;display:flex;align-items:center;justify-content:center;">📄</div>`;
        }

        return `
          <div class="card">
            ${preview}
            <p>${file}</p>
            <button onclick="deleteFile('${file}')">Delete</button>
          </div>
        `;
      }).join("")}
    </div>
  `;
}

async function loadFiles() {
  const res = await fetch("/files");
  const files = await res.json();

  const c = categorize(files);

  content.innerHTML =
    createRow("🎬 Videos", c.videos, "video") +
    createRow("🖼️ Images", c.images, "image") +
    createRow("📱 APK", c.apks, "apk") +
    createRow("📂 Others", c.others, "other");
}

function play(file) {
  video.src = "/uploads/" + file;
  container.style.display = "flex";
  video.play();
}

document.getElementById("closeBtn").onclick = () => {
  video.pause();
  container.style.display = "none";
};

async function upload() {
  const file = document.getElementById("fileInput").files[0];
  if (!file) return alert("Select file");

  const fd = new FormData();
  fd.append("file", file);

  await fetch("/upload", { method:"POST", body:fd });
  loadFiles();
}

async function deleteFile(name) {
  await fetch("/delete", {
    method: "POST",
    headers: { "Content-Type": "application/x-www-form-urlencoded" },
    body: "name=" + encodeURIComponent(name)
  });

  loadFiles();
}

loadFiles();
</script>

</body>
</html>
