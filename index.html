<!DOCTYPE html>
<html>
<head>
  <title>Media Hub</title>

  <style>
    body {
      background: black;
      color: white;
      font-family: Arial;
      margin: 0;
    }

    h1 {
      margin: 20px;
    }

    .top-bar {
      margin: 20px;
    }

    input {
      padding: 6px;
      margin-right: 5px;
    }

    button {
      background: red;
      color: white;
      border: none;
      padding: 8px 12px;
      border-radius: 5px;
      cursor: pointer;
    }

    .row {
      margin: 20px;
      position: relative;
    }

    .row-content {
      display: flex;
      overflow-x: auto;
      gap: 10px;
    }

    .card {
      min-width: 200px;
      background: #111;
      padding: 10px;
      border-radius: 10px;

      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    video, img {
      width: 100%;
      border-radius: 8px;
      margin-bottom: 10px;
    }

    .arrow {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      font-size: 20px;
      background: rgba(0,0,0,0.7);
    }

    .left { left: 0; }
    .right { right: 0; }

    #viewer {
      display: none;
      position: fixed;
      top:0;
      left:0;
      width:100%;
      height:100%;
      background:black;
      justify-content:center;
      align-items:center;
      flex-direction:column;
    }

    #viewer video, #viewer img {
      max-width:90%;
      max-height:80%;
    }

    #closeBtn {
      position:absolute;
      top:10px;
      right:10px;
      font-size:25px;
      background:red;
    }

    .grid {
      display:grid;
      grid-template-columns: repeat(3,1fr);
      gap:10px;
    }
  </style>
</head>

<body>

<h1>📺 Media Hub</h1>

<div class="top-bar">
  <button onclick="createRoom()">Create Room</button>

  <input id="joinCode" placeholder="Enter code">
  <button onclick="joinRoom()">Join Room</button>

  <h3 id="roomInfo"></h3>

  <br><br>

  <input type="file" id="fileInput">
  <button onclick="upload()">Upload</button>
</div>

<!-- PROGRESS -->
<div id="progressBox" style="display:none; margin:20px;">
  <div style="background:#333; height:20px; width:300px;">
    <div id="progressBar" style="background:red; height:20px; width:0;"></div>
  </div>
  <div id="progressText"></div>
</div>

<div id="content"></div>
<div id="seeAllPage" style="display:none;"></div>

<div id="viewer">
  <button id="closeBtn" onclick="closeViewer()">❌</button>
  <video id="viewVideo" controls></video>
  <img id="viewImage">
</div>

<script>

/* ================= ROOM SYSTEM ================= */
let roomId = localStorage.getItem("roomId");

function createRoom(){
  fetch("/create-room",{method:"POST"})
  .then(res=>res.json())
  .then(data=>{
    roomId = data.roomId;
    localStorage.setItem("roomId",roomId);

    roomInfo.innerText = "Room Code: " + data.code;
    loadFiles();
  });
}

function joinRoom(){
  const code = joinCode.value;

  fetch("/join-room",{
    method:"POST",
    headers:{ "Content-Type":"application/json" },
    body: JSON.stringify({code})
  })
  .then(res=>res.json())
  .then(data=>{
    roomId = data.roomId;
    localStorage.setItem("roomId",roomId);

    roomInfo.innerText = "Joined Room";
    loadFiles();
  });
}

/* ================= UPLOAD ================= */
function upload(){
  if(!roomId) return alert("Create or join room first");

  const file = fileInput.files[0];
  if(!file) return alert("Select file");

  const fd = new FormData();
  fd.append("file",file);
  fd.append("roomId",roomId);

  const xhr = new XMLHttpRequest();

  progressBox.style.display="block";

  xhr.upload.onprogress = e=>{
    if(e.lengthComputable){
      const p = Math.round((e.loaded/e.total)*100);
      progressBar.style.width = p+"%";
      progressText.innerText = p+"% uploaded";
    }
  };

  xhr.onload = ()=>{
    progressText.innerText="Upload Complete ✅";
    loadFiles();
  };

  xhr.open("POST","/upload");
  xhr.send(fd);
}

/* ================= LOAD ================= */
async function loadFiles(){
  if(!roomId) return;

  const res = await fetch(`/files?roomId=${roomId}`);
  const files = await res.json();

  const c = categorize(files);

  content.innerHTML =
    createRow("🎬 Videos",c.videos,"video","vrow") +
    createRow("🖼 Images",c.images,"image","irow") +
    createRow("📦 Others",c.others,"other","orow");
}

/* ================= CATEGORY ================= */
function categorize(files){
  const c={videos:[],images:[],others:[]};

  files.forEach(f=>{
    if(f.url.includes(".mp4")) c.videos.push(f);
    else if(f.url.match(/\.(jpg|png|jpeg)/)) c.images.push(f);
    else c.others.push(f);
  });

  return c;
}

/* ================= ROW ================= */
function createRow(title,items,type,id){
  if(!items.length) return "";

  return `
  <div class="row">
    <div style="display:flex;justify-content:space-between;">
      <h2>${title}</h2>
      <button onclick="openSeeAll('${type}')">See All</button>
    </div>

    <button class="arrow left" onclick="scrollRow('${id}',-1)">◀</button>

    <div class="row-content" id="${id}">
      ${items.map(f=>`
        <div class="card">
          ${
            type==="video"
            ? `<video src="${f.url}" onclick="openVideo('${f.url}')"></video>`
            : `<img src="${f.url}" onclick="openImage('${f.url}')">`
          }
          <button onclick="deleteFile('${f.publicId}')">Delete</button>
        </div>
      `).join("")}
    </div>

    <button class="arrow right" onclick="scrollRow('${id}',1)">▶</button>
  </div>
  `;
}

function scrollRow(id,dir){
  document.getElementById(id).scrollLeft += dir*300;
}

/* ================= DELETE ================= */
function deleteFile(publicId){
  if(!confirm("Delete this file?")) return;

  fetch("/delete",{
    method:"POST",
    headers:{ "Content-Type":"application/json" },
    body: JSON.stringify({ publicId })
  }).then(loadFiles);
}

/* ================= VIEW ================= */
function openVideo(url){
  viewer.style.display="flex";
  viewVideo.src=url;
  viewVideo.style.display="block";
  viewImage.style.display="none";
}

function openImage(url){
  viewer.style.display="flex";
  viewImage.src=url;
  viewImage.style.display="block";
  viewVideo.style.display="none";
}

function closeViewer(){
  viewer.style.display="none";
  viewVideo.pause();
}

/* ================= SEE ALL ================= */
function openSeeAll(type){
  fetch(`/files?roomId=${roomId}`)
  .then(res=>res.json())
  .then(files=>{
    const filtered = files.filter(f=>{
      if(type==="video") return f.url.includes(".mp4");
      if(type==="image") return f.url.match(/\.(jpg|png|jpeg)/);
      return true;
    });

    let html = `
      <button onclick="closeSeeAll()">⬅ Back</button>
      <h2>${type}</h2>
      <div class="grid">
    `;

    filtered.forEach(f=>{
      html += `
        <div class="card">
          ${
            type==="video"
            ? `<video src="${f.url}" controls></video>`
            : `<img src="${f.url}">`
          }
          <button onclick="deleteFile('${f.publicId}')">Delete</button>
        </div>
      `;
    });

    html += "</div>";

    content.style.display="none";
    seeAllPage.innerHTML=html;
    seeAllPage.style.display="block";
  });
}

function closeSeeAll(){
  seeAllPage.style.display="none";
  content.style.display="block";
}

/* INIT */
loadFiles();

</script>

</body>
</html>
